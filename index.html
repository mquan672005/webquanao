<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Quần Áo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- HEADER -->
    <div class="dau-trang">
      <div class="logo">🛍 Shop Clothes</div>

      <div class="menu">
        <a href="#">Trang chủ</a>
        <a href="#">Nam</a>
        <a href="#">Nữ</a>
        <a href="#">Liên hệ</a>
      </div>

      <div class="tim-kiem">
        <input type="text" placeholder="Tìm sản phẩm..." />
      </div>
    </div>

    <!-- BANNER -->
    <div class="banner">
      <div class="noi-dung-banner">
        <h1>SALE 50%</h1>
        <p>Bộ sưu tập mới 2026</p>
        <button class="nut-banner">Mua ngay</button>
      </div>
    </div>

    <!-- DANH MỤC -->
    <div class="danh-muc">
      <div class="muc">Áo</div>
      <div class="muc">Quần</div>
      <div class="muc">Áo khoác</div>
      <div class="muc">Phụ kiện</div>
    </div>

    <!-- SẢN PHẨM -->
    <div class="noi-dung">
      <h2 class="tieu-de">Sản phẩm nổi bật</h2>

      <div class="danh-sach">
        <div class="san-pham">
          <img class="hinh" src="./image/aothun.jpg" />
          <div class="thong-tin">
            <h4>Áo thun</h4>
            <p class="gia">150.000đ</p>
            <button class="nut">Thêm vào giỏ</button>
          </div>
        </div>

        <div class="san-pham">
          <img class="hinh" src="./image/quanjean.jpg" />
          <div class="thong-tin">
            <h4>Quần jeans</h4>
            <p class="gia">300.000đ</p>
            <button class="nut">Thêm vào giỏ</button>
          </div>
        </div>

        <div class="san-pham">
          <img class="hinh" src="./image/aokhoac.jpg" />
          <div class="thong-tin">
            <h4>Áo khoác</h4>
            <p class="gia">450.000đ</p>
            <button class="nut">Thêm vào giỏ</button>
          </div>
        </div>

        <div class="san-pham">
          <img class="hinh" src="./image/aosomi.jpg" />
          <div class="thong-tin">
            <h4>Áo sơ mi</h4>
            <p class="gia">250.000đ</p>
            <button class="nut">Thêm vào giỏ</button>
          </div>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="chan-trang">© 2026 Shop Clothes</div>
  </body>
</html>
